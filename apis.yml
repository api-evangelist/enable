name: Enable
description: 'Enable Medicine is a healthcare and life-sciences data company that licenses
  an integrated, AI-ready index of clinical, spatial, cellular, and molecular data. Its
  research platform helps biopharma companies, academic institutions, and healthcare providers
  run spatial-biology analysis — spatial proteomics, cell phenotyping, tumor-microenvironment
  characterization, immune profiling, and biomarker identification — across 20+ disease areas
  over harmonized datasets spanning 10M+ patients and 125M+ cells. The platform is delivered
  through a login-gated web application at app.enablemedicine.com; no public developer API is
  currently documented. Backed by initialized-capital, insight-partners, lightspeed-venture-partners,
  menlo-ventures, norwest-venture-partners, and sierra-ventures.'
